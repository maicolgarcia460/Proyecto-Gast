<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAST - Mensaje del sistema</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/Estilos.css">
</head>

<body class="app-body">

  <!-- Encabezado -->
  <header class="app-header">
    <div class="app-header__role">
      <h1 id="rolTitulo" class="app-header__title"></h1>
    </div>

    <!-- Logo -->
    <div class="app-brand">
      <h1 class="app-brand__name">GAST</h1>
      <img src="assets/img/logo-gast.png" alt="Logo GAST" class="app-brand__logo">
    </div>
  </header>

  <!-- Contenedor -->
  <div class="bg-[#E5E5E5] border-4 border-black rounded-2xl w-[90%] h-screen flex justify-center items-center mx-auto">

    <!-- Tarjeta del mensaje -->
    <div id="tarjetaMensaje" class="bg-white border-4 rounded-2xl shadow-2xl p-10 text-center max-w-lg w-[90%] transition-all duration-500">

      <!-- Icono dinámico -->
      <div id="iconoMensaje" class="text-6xl font-bold mb-6"> ✓ </div>

      <!-- Texto dinámico -->
      <div id="mensajeTexto" class="text-2xl text-black font-bold mb-4"> </div>

      <!-- Texto secundario -->
      <div class="text-sm text-gray-500"> Redirigiendo automáticamente... </div>

    </div>
  </div>
  
<script type="module" src="js/Mensaje_exitoso.js"></script>
</body>
</html>
