<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAST - Iniciar Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/Estilos.css">
</head>

<body class="app-body">

  <!-- Barra superior con los roles -->
  <nav class="login-role-nav" aria-label="Selección de rol">
    <button id="solicitante" class="login-role-button bg-[#1E88E5]">Solicitante</button>
    <button id="jefe" class="login-role-button">Jefe de área</button>
    <button id="colaborador" class="login-role-button">Colaborador</button>
  </nav>

  <!-- Franja azul -->
  <div class="login-hero">
    <div class="login-hero__content">
      <h1 class="login-hero__title">GAST</h1>
    </div>
  </div>

  <!-- Contenedor principal -->
  <main class="login-layout">

    <!-- Formulario de inicio de sesión -->
    <div class="login-card">
      <h2 class="text-3xl font-bold mb-6 text-gray-600">Iniciar Sesión</h2>

      <form id="formLogin" class="space-y-5">
        <div class="text-left">
          <label class="block text-lg text-gray-700 mb-1">Usuario:</label>
          <input id="usuario" type="text" required class="w-full border-2 border-gray-400 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-[#1E88E5]" />
        </div>
        <div class="text-left">
          <label class="block text-lg text-gray-700 mb-1">Contraseña:</label>
          <input id="password" type="password" required class="w-full border-2 border-gray-400 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-[#1E88E5]" />
        </div>
        <p id="mensajeError" class="hidden text-red-600 text-sm"></p>
        <button type="submit" class="w-full bg-[#1E88E5] text-white font-semibold py-2 rounded-md hover:bg-blue-600 transition duration-200"> Ingresar </button>
        <a href="#" class="text-sm text-[#1E88E5] hover:underline block mt-2"> ¿Olvidaste la contraseña? </a>
      </form>
    </div>

    <!-- Línea divisoria -->
    <div class="login-divider" aria-hidden="true"></div>

    <!-- Logo -->
    <div class="login-logo-container">
      <img src="assets/img/logo-gast.png" alt="Logo GAST" class="login-logo">
    </div>
  </main>

  <script type="module" src="js/Inicio_sesion.js"></script>
</body>
</html>
