<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprobar Solicitudes - GAST</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/Estilos.css">
</head>

<body class="app-body">

  <!-- Encabezado -->
  <header class="app-header">
    <div class="app-header__role">
      <h1 id="rolTitulo" class="app-header__title"></h1>
    </div>

    <!-- Logo -->
    <div class="app-brand">
      <h1 class="app-brand__name">GAST</h1>
      <img src="assets/img/logo-gast.png" alt="Logo GAST" class="app-brand__logo">
    </div>
  </header>

  <!-- Barra de navegación -->
  <nav class="app-nav" aria-label="Navegación principal">
    <div class="app-nav__links">
      <a id="home" href="Menu_principal.html" class="app-nav__link app-nav__link--padded">Home</a>
      <a id="solicitudes" href="Registrar_solicitud.html" class="app-nav__link">Solicitudes en curso</a>
      <a id="aprobar" href="Aprobar_solicitud.html" class="app-nav__link app-nav__link--active">Solicitudes pendientes por aprobar</a>
      <a id="asignar" href="Asignar_solicitud.html" class="app-nav__link">Solicitudes pendientes por asignar</a>
      <a id="estadisticas" href="Modulo_estadisticas.html" class="app-nav__link">Estadísticas</a>
    </div>
    
    <!-- Buscador -->
    <div class="app-search">
      <input type="text" placeholder="Buscar" class="app-search__input focus:outline-none focus:ring focus:ring-blue-300">
      <button class="app-search__button hover:text-gray-200" aria-label="Buscar">🔍</button>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="page-content">

    <!-- Título -->
    <div class="page-heading">
      <h2 class="page-title">Solicitudes pendientes por aprobar</h2>
      <div class="request-tabs"></div>
    </div>

    <!-- Contenedor listado de solicitudes -->
    <section class="content-panel">
      <div id="listaSolicitudes" class="space-y-4"></div>

    <!-- Plantilla de tarjeta -->
      <template id="templateSolicitud">
        <div class="list-item">
          <span class="font-bold nombreSolicitud"></span>
          <button class="btnAprobar action-button list-item__action">Aprobar</button>
        </div>
      </template> 
    </section>

    <!-- Panel de solicitud -->
    <div id="panelDetalle" class="modal-panel hidden">
      <button data-cerrar="panelDetalle" class="absolute top-3 right-4 text-black hover:text-red-600 text-2xl font-bold">&times;</button>
      <h2 id="tituloSolicitud" class="font-bold text-2xl text-black mb-4"></h2>
      <div class="bg-gray-200 w-full rounded-2xl border-2 border-black shadow-md p-5 text-left space-y-2">
        <div id="infoAvance" class="text-black text-sm space-y-1"></div>
      </div>

    <!-- Comentarios -->
      <label class="font-bold text-black block mt-4 mb-1 text-base">Comentarios:</label>
      <textarea id="Comentarios" class="bg-white rounded-md border border-black w-full h-[55px] mb-2"></textarea>

    <!-- Botones de aprobación -->
      <div class="mt-2">
        <p class="text-lg font-semibold text-black mb-2">Aprobar solicitud:</p>
        <div class="flex items-center gap-4">
          <button id="btnSi" class="bg-white border-2 border-black text-black font-bold px-4 py-1 rounded-xl shadow hover:bg-[#1E88E5]/30 transition"> SI </button>
          <span class="text-xl font-bold text-black">-</span>
          <button id="btnNo" class="bg-white border-2 border-black text-black font-bold px-4 py-1 rounded-xl shadow hover:bg-[#1E88E5]/30 transition"> NO </button>
        </div>
      </div>
    </div>
  </main>

<script type="module" src="js/Aprobar_solicitud.js"></script>
</body>
</html>
