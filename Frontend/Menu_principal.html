<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAST - Menú Principal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/Estilos.css">
</head>

<body class="app-body">

  <!-- Encabezado -->
  <header class="app-header">
    <div class="app-header__role">
      <h1 id="rolTitulo" class="app-header__title"></h1>
    </div>

    <!-- Logo-->
    <div class="app-brand">
      <h1 class="app-brand__name">GAST</h1>
      <img src="assets/img/logo-gast.png" alt="Logo GAST" class="app-brand__logo">
    </div>
  </header>

  <!-- Barra de navegación -->
  <nav class="app-nav" aria-label="Navegación principal">
    <div class="app-nav__links">
      <a id="home" href="Menu_principal.html" class="app-nav__link app-nav__link--active">Home</a>
      <a id="solicitudes" href="Registrar_solicitud.html" class="app-nav__link">Solicitudes en curso</a>
      <a id="aprobar" href="Aprobar_solicitud.html" class="app-nav__link">Solicitudes pendientes por aprobar</a>
      <a id="asignar" href="Asignar_solicitud.html" class="app-nav__link">Solicitudes pendientes por asignar</a>
      <a id="estadisticas" href="Modulo_estadisticas.html" class="app-nav__link">Estadísticas</a>
    </div>
  </nav>

  <main class="home-dashboard">

  <!-- Tarjetas del menu -->
    <section class="home-cards" aria-label="Módulos del sistema">
      <a id="Tsolicitudes" href="Registrar_solicitud.html" class="block">
        <div class="home-card">
          <img src="assets/img/SP.png" alt="Solicitudes en curso" class="home-card__image" />
          <h2 class="home-card__title">Solicitudes en curso</h2>
        </div>
      </a>

      <a id="Taprobar" href="Aprobar_solicitud.html" class="block">
        <div class="home-card">
          <img src="assets/img/SPA.png" alt="Solicitudes pendientes por aprobar" class="home-card__image" />
          <h2 class="home-card__title">Solicitudes pendientes por aprobar</h2>
        </div>
      </a>
      
      <a id="Tasignar" href="Asignar_solicitud.html" class="block">
        <div class="home-card">
          <img src="assets/img/SPA.png" alt="Solicitudes pendientes por asignar" class="home-card__image" />
          <h2 class="home-card__title">Solicitudes pendientes por asignar</h2>
        </div>
      </a>
      
      <a id="Testadisticas" href="Modulo_estadisticas.html" class="block">
        <div class="home-card">
          <img src="assets/img/EST.png" alt="Estadísticas" class="home-card__image" />
          <h2 class="home-card__title">Estadísticas</h2>
        </div>
      </a>
    </section>

    <aside class="home-sidebar">

    <!-- Línea divisoria -->
    <div class="home-sidebar__divider" aria-hidden="true"></div>

    <!-- sección derecha -->
    <div class="home-sidebar__content">
      <img src="assets/img/IMG_PLANO.png" alt="Plano de trabajo" class="home-sidebar__image">
      <div class="flex space-x-2 mb-6">
        <div class="w-2 h-2 bg-gray-400 rounded-full"></div>
        <div class="w-2 h-2 bg-gray-200 rounded-full"></div>
      </div>
      <button id="btnCerrarSesion" class="logout-button">Cerrar sesión</button>
    </div>
    </aside>
  </main>

<script type="module" src="js/Menu_principal.js"></script>
</body>
</html>
